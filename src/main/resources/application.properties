spring.application.name=parches
server.port=8083

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parches_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# AWS S3 (Parche profile pictures) — presigned POST upload
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:patricia-parches-pictures}
# Optional: S3-compatible endpoint for local dev (LocalStack/MinIO), e.g. http://localhost:4566
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
# Optional: CloudFront/custom domain serving the bucket; otherwise the S3 object URL is used
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

# Profile picture upload policy
parche.picture.max-bytes=${PARCHE_PICTURE_MAX_BYTES:5242880}
parche.picture.upload-expiry-seconds=${PARCHE_PICTURE_UPLOAD_EXPIRY_SECONDS:300}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true