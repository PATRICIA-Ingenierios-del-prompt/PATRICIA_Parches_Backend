# Pulls what Parches needs from AWS Secrets Manager into a native K8s Secret
# (parches-secrets) that the Deployment mounts via envFrom.
#
# amazon-mq and cache-redis are JSON blobs, each field needs its own
# `property`; secretKey names match Spring Boot's OWN property-binding
# convention (SPRING_RABBITMQ_*, SPRING_DATA_REDIS_PASSWORD) - same fix
# pattern as Auth/Users, since application.properties was updated to
# reference these exact names (see the required code changes shipped
# alongside this chart). REDIS_HOST/REDIS_PORT keep their existing names,
# already what application.properties expects.
#
# parche-core/rds is ALSO a JSON blob but its keys (SPRING_DATASOURCE_URL/
# USERNAME/PASSWORD) already match application.properties verbatim - no
# renaming needed here, unlike Users' original Postgres mismatch.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: parches-secrets
  namespace: patricia-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: parches-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_RABBITMQ_ADDRESSES
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/amazon-mq", property: SPRING_RABBITMQ_ADDRESSES }
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/amazon-mq", property: SPRING_RABBITMQ_USERNAME }
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/amazon-mq", property: SPRING_RABBITMQ_PASSWORD }
    - secretKey: REDIS_HOST
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/cache-redis", property: REDIS_HOST }
    - secretKey: REDIS_PORT
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/cache-redis", property: REDIS_PORT }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/cache-redis", property: REDIS_PASSWORD }
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/parche-core/rds", property: SPRING_DATASOURCE_URL }
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/parche-core/rds", property: SPRING_DATASOURCE_USERNAME }
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: { key: "{{ .Values.externalSecrets.prefix }}/parche-core/rds", property: SPRING_DATASOURCE_PASSWORD }
