apiVersion: v1
kind: ServiceAccount
metadata:
  # "parche-core", not "parches": the IRSA role's trust policy binds
  # system:serviceaccount:patricia-app:parche-core (module.eks derives the sub
  # from the service key in var.all_services). Renaming the SA is the cheap
  # side of that contract; the Deployment/Service keep their "parches" names.
  name: parche-core
  namespace: patricia-app
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
  {{- end }}
