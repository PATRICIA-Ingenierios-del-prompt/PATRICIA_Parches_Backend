# Defaults for the Parches MS chart. The CD job overrides image.repository and
# image.tag per deploy (pinned to the commit SHA); everything else is edited
# here and versioned with the code it configures.
#
# NAMING NOTE: the repo/app is "parches" (spring.application.name=parches,
# port 8083), but the surrounding AWS infra was provisioned under the name
# "parche-core" (ECR repo patricia-dev/parche-core, IRSA role
# patricia-dev-parche-core-irsa, RDS secret patricia-dev/parche-core/rds).
# This chart's own k8s objects (Deployment/Service) are named "parches" to
# match the app itself; only the AWS-side references below use "parche-core".
# If Gateway's route config expects a different in-cluster Service hostname
# for this MS, rename the Service (and this comment) to match — check
# Gateway's RouteConfig/application.yml before assuming "parches" is right.

image:
  repository: ""            # set by CD: <account>.dkr.ecr.<region>.amazonaws.com/patricia-dev/parche-core
  tag: ""                   # set by CD: short commit SHA
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  # Per-service IRSA role (module.eks.service_irsa["parche-core"]). The
  # S3PresignedPostAdapter resolves credentials via the SDK's default chain,
  # so IRSA is the credential source in-cluster — no static keys.
  # The chart's ServiceAccount is named "parche-core" (NOT "parches") because
  # the role's trust policy binds system:serviceaccount:patricia-app:parche-core.
  # s3:PutObject on parches/pictures/* is attached in Ulink_Infra's
  # iam-parches-s3.tf (mirrors iam-users-s3.tf).
  roleArn: "arn:aws:iam::188701360691:role/patricia-dev-parche-core-irsa"

config:
  # Shared private uploads bucket (module.s3, Ulink_Infra). Objects are read
  # through the uploads CloudFront distribution (same one Users serves
  # profile photos from — see users-config's AWS_S3_PUBLIC_URL_BASE).
  awsS3Region: "us-east-1"
  awsS3Bucket: "patricia-dev-uploads-188701360691"
  awsS3Endpoint: ""
  awsS3PublicBaseUrl: "https://d1uaykdrxdyy3x.cloudfront.net"
  parchePictureMaxBytes: "5242880"
  parchePictureUploadExpirySeconds: "300"

externalSecrets:
  clusterSecretStore: patricia-aws-secrets-manager
  prefix: "patricia-dev"
  # What's already provisioned in AWS Secrets Manager (confirmed via
  # `aws secretsmanager list-secrets` earlier this session):
  #   patricia-dev/amazon-mq        -> EXISTS. SPRING_RABBITMQ_ADDRESSES/USERNAME/PASSWORD.
  #   patricia-dev/cache-redis      -> EXISTS. REDIS_HOST/REDIS_PORT/REDIS_PASSWORD.
  #   patricia-dev/parche-core/rds  -> EXISTS. SPRING_DATASOURCE_URL/USERNAME/PASSWORD -
  #                                    already matches application.properties' own
  #                                    property names exactly, no renaming needed
  #                                    (unlike Users' original Postgres mismatch).
  #
  # S3 note: the adapter still signs the POST policy by hand (the SDK's
  # S3Presigner doesn't do POST policies) but now pulls credentials from the
  # SDK's DefaultCredentialsProvider, so IRSA supplies rotating temp creds
  # in-cluster. No AWS keys in Secrets Manager or this ConfigMap — see the
  # serviceAccount section above for the pending infra pieces.

resources:
  requests: { cpu: 500m, memory: 768Mi }
  limits:   { cpu: "1",  memory: 1Gi }

hpa:
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70